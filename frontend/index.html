<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scammer Ko Scam Kar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF1F4;--ink:#101C28;--line:#C9D2DB;--red:#D7263D;--amber:#E8A317;--muted:#5B6B7A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
h1,h2,.big{font-family:'Bricolage Grotesque',system-ui,sans-serif}
header{padding:20px 28px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:30px;font-weight:800}
header p{margin:0;color:var(--muted)}
h2{margin:0 0 10px;font-size:18px;font-weight:500}
main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;padding:0 28px 28px}
section{display:flex;flex-direction:column;gap:20px}
@media(max-width:820px){main{grid-template-columns:1fr;padding:0 16px 16px}}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;transition:background .4s,color .4s}
.card.warn{border-color:var(--amber);border-width:2px}
.card.alert{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1s 3}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(215,38,61,.25)}}
@media(prefers-reduced-motion:reduce){.card.alert{animation:none}}
.big{font-size:96px;font-weight:800;line-height:1;margin:4px 0}
#label{font-size:20px;font-weight:500}
.chip{display:inline-block;padding:2px 10px;margin:8px 6px 0 0;border-radius:99px;background:rgba(0,0,0,.08);font-size:14px}
.alert .chip{background:rgba(255,255,255,.22)}
button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:inherit;border-color:currentColor}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#log{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 12px;border-radius:10px}
.m.scammer{background:#FBE3E6;align-self:flex-start}
.m.honeypot{background:#D9F0EE;align-self:flex-end}
#interim{color:var(--muted)}
pre{white-space:pre-wrap;font-size:13px;max-height:420px;overflow:auto;background:var(--paper);padding:12px;border-radius:8px}
ul{margin:0 0 12px;padding-left:20px}
</style>
</head>
<body>
<header><h1>Scammer Ko Scam Kar</h1><p>Live scam-call guardian with an AI honeypot</p></header>
<main>
<section>
  <div class="card" id="threat">
    <div>Threat score</div>
    <div class="big" id="score">0%</div>
    <div id="label">Listening…</div>
    <div id="tactics"></div>
    <p><button id="honey" disabled>Turn on Honeypot</button> <span id="timer"></span></p>
    <small id="hint">Honeypot unlocks at 90% confidence.</small>
  </div>
  <div class="card">
    <h2>Start a call</h2>
    <p><button id="demo">Run demo call</button> <button id="mic" class="ghost">Use microphone</button></p>
    <label>Language <select id="lang"><option value="en-IN">English (India)</option><option value="hi-IN">Hindi</option></select></label>
  </div>
</section>
<section>
  <div class="card"><h2>Live transcript</h2><div id="log"></div><em id="interim"></em></div>
  <div class="card">
    <h2>Details captured from the caller</h2>
    <ul id="ents"><li>Nothing yet</li></ul>
    <button id="rep" class="ghost">Generate cybercrime report</button>
  </div>
  <div class="card" id="repbox" hidden><h2>Report</h2><pre id="repout"></pre><button id="dl">Download report</button></div>
</section>
</main>
<script>
// Leave empty when the backend serves this page. If you host the frontend elsewhere, set your backend URL, e.g. 'https://my-api.onrender.com'
const API_BASE='';
const $=id=>document.getElementById(id);
let sid,honey=false,micOn=false,rec,speaking=false,demoing=false,chain=Promise.resolve(),t0,tick,last='';
const api=(u,b)=>fetch(API_BASE+u,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)}).then(r=>r.json());

const DEMO=[
 "Hello, this is Inspector Rajesh Kumar from Mumbai Police. An illegal parcel under your Aadhaar number was seized at Andheri customs.",
 "The parcel contains MDMA and fake passports. A CBI warrant is issued in your name. You are under digital arrest, do not disconnect this call.",
 "Do not tell anyone in your family, or you will be arrested immediately. Keep your video on.",
 "To prove your innocence, transfer the verification amount to the RBI safe account. Send it to UPI ID rajesh.cbi@okaxis right now.",
 "If UPI fails, use account number 123456789012, IFSC SBIN0001234, or open http://cbi-verify-india.xyz and read me the OTP. My number is 9876543210."
];

function speak(text,who){return new Promise(res=>{
  if(!('speechSynthesis' in window)) return res();
  speaking=true; if(rec) try{rec.stop()}catch{}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=demoing?'en-IN':$('lang').value;
  u.pitch=who==='honeypot'?1.5:.6; u.rate=who==='honeypot'?.85:1;
  const done=()=>{speaking=false; if(micOn) try{rec.start()}catch{}; res()};
  u.onend=done; u.onerror=done; speechSynthesis.speak(u);
});}

function addMsg(role,text){
  const d=document.createElement('div'); d.className='m '+role;
  const b=document.createElement('b'); b.textContent=role==='scammer'?'Caller':'Kamla Devi (AI)';
  d.append(b,document.createElement('br'),text); $('log').append(d); $('log').scrollTop=1e9;
}

function render(a){
  const p=Math.round(a.score*100);
  $('score').textContent=p+'%'; $('label').textContent=a.label;
  $('threat').className='card '+(p>=90?'alert':p>=50?'warn':'');
  $('tactics').replaceChildren(...a.tactics.map(t=>Object.assign(document.createElement('span'),{className:'chip',textContent:t})));
  $('honey').disabled=p<90&&!honey;
  $('hint').textContent=p>=90?'Fraud confirmed. Honeypot ready.':'Honeypot unlocks at 90% confidence.';
  const es=a.entities.length?a.entities:[{kind:'Nothing yet',value:''}];
  $('ents').replaceChildren(...es.map(e=>Object.assign(document.createElement('li'),{textContent:e.value?`${e.kind}: ${e.value}`:e.kind})));
}

function setHoney(on){
  honey=on; $('honey').textContent=on?'Honeypot on: AI is answering':'Turn on Honeypot';
  clearInterval(tick); $('timer').textContent='';
  if(on){t0=Date.now(); tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);
    $('timer').textContent=`Caller engaged ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},1000);}
}
$('honey').onclick=()=>setHoney(!honey);

async function handle(text,auto=false){
  if(!text) return;
  addMsg('scammer',text);
  const a=await api('/api/analyze',{sid,text}); render(a);
  if(auto&&a.score>=.9&&!honey) setHoney(true);
  if(honey&&a.score>=.9){
    const r=await api('/api/honeypot',{sid,text});
    addMsg('honeypot',r.reply); await speak(r.reply,'honeypot');
  }
}

async function reset(){
  sid=(await api('/api/session',{})).sid; $('log').replaceChildren(); setHoney(false);
  render({score:0,label:'Listening…',tactics:[],entities:[]}); $('repbox').hidden=true;
}

$('demo').onclick=async()=>{
  if(micOn) $('mic').click();
  await reset(); demoing=true; $('demo').disabled=true;
  for(const line of DEMO){await speak(line,'scammer'); await handle(line,true); await new Promise(r=>setTimeout(r,500));}
  demoing=false; $('demo').disabled=false;
};

$('mic').onclick=async()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return alert('Live mic needs Chrome or Edge. Use the demo call instead.');
  if(micOn){micOn=false; rec.stop(); $('mic').textContent='Use microphone'; return;}
  await reset(); micOn=true; $('mic').textContent='Stop listening';
  rec=new SR(); rec.lang=$('lang').value; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{let tmp='';
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
      if(r.isFinal){$('interim').textContent='';const t=r[0].transcript.trim();chain=chain.then(()=>handle(t));}
      else tmp=r[0].transcript;}
    if(tmp) $('interim').textContent=tmp;};
  rec.onend=()=>{if(micOn&&!speaking) try{rec.start()}catch{}};
  rec.start();
};

$('rep').onclick=async()=>{
  const r=await api('/api/report/'+sid); last=r.report;
  $('repout').textContent=last; $('repbox').hidden=false; $('repbox').scrollIntoView({behavior:'smooth'});
};
$('dl').onclick=()=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([last],{type:'text/plain'})); a.download=`cyber-report-${sid}.txt`; a.click();};

reset();
</script>
</body>
</html>
